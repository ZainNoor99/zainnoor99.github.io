<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 276" role="img" aria-label="Hybrid animated childhood photo">
<style>
.photo{opacity:0;filter:blur(4px);animation:reveal .9s ease forwards 2.2s}
.stroke{fill:none;stroke:#8f6b28;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.1s ease forwards;animation-delay:var(--delay,0ms)}
.stroke2{fill:none;stroke:#ccb375;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.4s ease forwards;animation-delay:var(--delay,0ms);opacity:.95}
.glow{fill:none;stroke:#d8c79f;stroke-width:7;opacity:.32;filter:blur(4px)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes reveal{to{opacity:1;filter:blur(0)}}
@media(prefers-reduced-motion:reduce){.photo{opacity:1;filter:none;animation:none}.stroke,.stroke2{stroke-dashoffset:0;animation:none}}
</style>
