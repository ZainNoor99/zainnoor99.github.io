<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<title>Animation</title>
<style>
:root{--gold:#b38a3e;--gold-deep:#8f6b28;--sage:#a8b99d;--cream:#f7f4ec;--card:rgba(255,253,248,.95);--text:#3a352d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);background:linear-gradient(180deg,#b6c7ac 0%,#b1c1a8 100%)}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(94vw,720px);background:var(--card);border:1px solid rgba(179,138,62,.45);border-radius:30px;padding:32px 24px 26px;box-shadow:0 24px 60px rgba(64,55,35,.12);display:grid;justify-items:center;gap:18px}
.kicker{font-family:Georgia,serif;color:var(--gold);font-size:1.35rem;letter-spacing:.08em}.sub{color:#75836c;letter-spacing:.2em;font-size:.8rem}
.frame{width:min(90%,320px);aspect-ratio:236/276;display:block;border:0}.caption{max-width:430px;text-align:center;color:#6d7566;line-height:1.5;font-size:.95rem}
button{appearance:none;border:1px solid rgba(179,138,62,.45);border-radius:999px;background:#fff8eb;color:var(--gold-deep);padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
<section class="card">
<div class="kicker">Zain &amp; Rida</div>
<div class="sub">HYBRID FACE-PRESERVING SVG</div>
<object id="art" class="frame" data="kids_hybrid.svg" type="image/svg+xml" aria-label="Face preserving hybrid SVG animation"></object>
<p class="caption">This version keeps the real faces/photo intact, and only animates SVG outline strokes and the reveal around them. That way the faces stay recognizable.</p>
<button id="replay" type="button">Replay animation</button>
</section>
</main>
<script>
const art=document.getElementById('art');
document.getElementById('replay').addEventListener('click',()=>{art.data='kids_hybrid.svg?v='+Date.now()});
</script>
</body>
</html>
