<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-148943172-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'UA-148943172-1');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- CSS -->
    <link rel="stylesheet" href="css/index.css" media="screen and (min-width: 1025px)">
    <link rel="stylesheet" href="css/indexSmallScreens.css" media="screen and (max-width: 1024px)">

    <!-- TypedJS -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.9"></script>

    <!-- Title Icon not currently present -->
    <!-- <link rel="icon" href="imgs/titleiconbig.png" type="image/icon type"> -->

    <title>Zain Noor</title>
</head>

<body>
    <div class="homePage">
        <div class="homeLeft">
            <div class="typedJS">
                <span id="typed-insertion"></span>
            </div>
            <p id="smallAbout" class="notVisitedAnimationP">An Aspiring Management Engineer</p>
        </div>
    
        <div class="homeRight">
            <ul>
                <li><a id="nav1" class="notVisitedAnimation" href="pages/About.html">About</a></li>
                <li><a id="nav2" class="notVisitedAnimation" href="pages/Experience.html">Experience</a></li>
                <li><a id="nav3" class="notVisitedAnimation" href="imgs/ZainNoorResume.pdf" target="_blank">Resume</a></li>
            </ul>
        </div>
    </div>

    <script>
        console.log(document.cookie)
        if (document.cookie.includes("isVisited=yes")) {
            document.getElementById('typed-insertion').innerHTML = 'Zain Noor'

            document.getElementById('typed-insertion').setAttribute('class','visitedAnimation');
            document.getElementById('smallAbout').setAttribute('class','visitedAnimationP');
            document.getElementById('nav1').setAttribute('class','visitedAnimation');
            document.getElementById('nav2').setAttribute('class','visitedAnimation');
            document.getElementById('nav3').setAttribute('class','visitedAnimation');
        } else {
            const minutes = 60;
            const date = new Date();
            date.setTime(date.getTime()+(minutes*60*1000))
            const expires = "; expires="+date.toUTCString()+';';
            document.cookie = 'isVisited=yes;' + expires;
            const typed = new Typed('#typed-insertion', {
                strings: ['I am', 'Zain Noor'],
                typeSpeed: 70,
                smartBackspace: true,
                backDelay: 1250,
                showCursor: false,
                startDelay: 500,
                fadeOut: true,
            });
        }
    </script>
</body>

</html>
