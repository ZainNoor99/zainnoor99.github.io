<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#fbf8f1">
    <title>Find Your Table</title>

    <script>
        (function () {
            const hasSeenIntro = /(?:^|;\s*)seatingIntroSeen=1(?:;|$)/.test(document.cookie);
            document.documentElement.classList.add(hasSeenIntro ? "skip-intro" : "show-intro");
        })();
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="intro-splash" class="intro-splash" aria-hidden="true">
        <object
            id="intro-art"
            class="intro-art"
            data="/animation/kids_hybrid.svg"
            type="image/svg+xml"
            tabindex="-1"
        ></object>
    </div>

    <main class="page-shell">
        <section class="card" aria-labelledby="page-title">
            <div class="monogram" aria-hidden="true">Zain <span>&amp;</span> Rida</div>
            <p class="eyebrow">04.10.2026</p>
            <h1 id="page-title">Find Your Table</h1>
            <p class="intro">Enter your name below to find your table.</p>

            <div class="search-wrap">
                <label for="guest-search" class="sr-only">Guest name</label>
                <input
                    id="guest-search"
                    type="search"
                    inputmode="search"
                    autocomplete="off"
                    autocapitalize="words"
                    spellcheck="false"
                    placeholder="Type your name"
                    aria-describedby="search-help"
                >
                <p id="search-help" class="help-text">You can enter a first name, last name, or part of a name.</p>
            </div>

            <div id="results" class="results" aria-live="polite"></div>
        </section>
    </main>

    <script src="guests.js"></script>
    <script src="search.js"></script>
    <script>
        (function () {
            const root = document.documentElement;

            if (!root.classList.contains("show-intro")) {
                return;
            }

            const splash = document.getElementById("intro-splash");
            const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            function rememberIntro() {
                document.cookie = "seatingIntroSeen=1; Max-Age=31536000; Path=/; SameSite=Lax";
            }

            function finishIntro() {
                rememberIntro();
                root.classList.add("intro-revealed");
                splash.classList.add("fade-out");

                window.setTimeout(() => {
                    splash.remove();
                    root.classList.remove("show-intro");
                    root.classList.add("skip-intro");
                }, prefersReducedMotion ? 0 : 800);
            }

            // Fixed timer from page render: SVG loading time is not added on top.
            // The art finishes around 2.6s, then stays visible for about 1 second.
            window.setTimeout(finishIntro, prefersReducedMotion ? 250 : 3600);
        })();
    </script>
</body>
</html>
